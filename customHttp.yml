# Custom response headers for cauldron.dequelabs.com, an AWS Amplify app.
# Amplify reads this file from the repo root at build time. It overrides any
# custom headers set in the Amplify console. Header changes take effect only
# after a new build.
# PR previews are manual deployments, so .github/workflows/pr-preview.yml copies
# this file into docs/dist for the preview to get the same headers.
customHeaders:
  - pattern: '**'
    headers:
      - key: 'Content-Security-Policy'
        # use.fontawesome.com serves the Font Awesome kit script loaded in
        # docs/index.html, plus the CSS and fonts that script loads.
        value: "default-src 'self'; script-src 'self' https://use.fontawesome.com; style-src 'self' 'unsafe-inline' https://use.fontawesome.com; font-src 'self' data: https://use.fontawesome.com; img-src 'self' data:; connect-src 'self' https://use.fontawesome.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=(), payment=(), usb=()'
      - key: 'Cross-Origin-Opener-Policy'
        value: 'same-origin'
      # Replaces the default "Server: AmazonS3", which Aikido flags.
      - key: 'Server'
        value: 'webserver'
  - pattern: '/storybook/**'
    headers:
      - key: 'Content-Security-Policy'
        # The built Storybook HTML has inline scripts, and
        # .storybook/preview-head.html adds an inline style.
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
