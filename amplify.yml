version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm@11.4.0
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm build
  artifacts:
    baseDirectory: docs/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
