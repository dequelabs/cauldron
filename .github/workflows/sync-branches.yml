name: Sync master/develop branches

on:
  push:
    branches:
      - master

jobs:
  create_sync_pull_request:
    runs-on: ubuntu-latest
    steps:
      - uses: dequelabs/action-sync-branches@v1
        with:
          github-token: ${{ secrets.MACHINE_USER_PAT }}
          pr-title: 'chore: merge master into develop'
          pr-body: 'Remember to _merge_ (rather than squash) this PR!'
          # action-sync-branches@v1 always reads pr-template; '' avoids a missing-file
          # warning for this repo, which does not have a pull request template.
          pr-template: ''
          head: master
