name: Tests

on:
  pull_request:
    branches:
      - develop
      - master
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: ./.github/actions/dependencies
      - name: Build packages
        run: pnpm build:react
      - run: pnpm test

  screenshots:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'update-screenshots') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: ./.github/actions/dependencies
      - name: Build packages
        run: |
          pnpm build:react
          pnpm build:styles
      - name: Screenshot testing
        run: |
          pnpm screenshots:docker
          pnpm screenshots
      - name: Screenshot test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshot-test-results
          path: ./e2e/test-results
          retention-days: 14

  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: ./.github/actions/dependencies
      - name: Build packages
        run: |
          pnpm build:react
          pnpm build:styles
      - run: pnpm build:docs
      # Newer versions of Ubuntu have increased security restrictions in which
      # puppeteer is unable to launch without additional configuration
      # See: https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
      - run: |
          export CHROME_DEVEL_SANDBOX=/opt/google/chrome/chrome-sandbox
          sudo chown root /opt/google/chrome/chrome-sandbox
          sudo chmod 4755 /opt/google/chrome/chrome-sandbox
          pnpm test:a11y
