name: Lint

on:
  pull_request:
    branches:
      - develop

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dependencies
      - run: pnpm lint
      - name: format check
        if: always()
        run: pnpm format:check
      - name: typecheck
        run: |
          pnpm build:react
          pnpm typecheck
