name: Lint

on:
  pull_request:
    branches:
      - develop

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/dependencies
      - run: pnpm lint
      - name: typecheck
        run: |
          pnpm build:react
          pnpm typecheck
