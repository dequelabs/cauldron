name: Lint

on:
  pull_request:
    branches:
      - develop

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/dependencies
      - run: pnpm lint
      - name: format check
        if: always()
        run: pnpm format:check
      - name: typecheck
        run: |
          pnpm build:react
          pnpm typecheck
