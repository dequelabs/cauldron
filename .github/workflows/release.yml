name: Release

on:
  push:
    branches:
      - develop
      - master

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:

  tests:
    uses: ./.github/workflows/tests.yml

  publish:
    if: github.ref == 'refs/heads/master'
    needs: [tests]
    runs-on: ubuntu-latest
    environment: registry.npmjs.org
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 'master'
      - uses: ./.github/actions/dependencies
      - name: Build packages
        run: |
          NODE_ENV=production yarn --cwd packages/react build
          NODE_ENV=production yarn --cwd packages/styles build
      - name: Publish @deque/cauldron-styles
        run: |
          cd packages/styles
          npm publish
      - name: Publish @deque/cauldron-react
        run: |
          cd packages/react
          npm publish

  canary:
    if: github.ref == 'refs/heads/develop'
    needs: [tests]
    runs-on: ubuntu-latest
    environment: registry.npmjs.org
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 'develop'
      - uses: ./.github/actions/dependencies
      - name: Build packages
        run: |
          NODE_ENV=production yarn --cwd packages/react build
          NODE_ENV=production yarn --cwd packages/styles build
      - name: Publish @deque/cauldron-styles
        run: |
          cd packages/styles
          # Read the package version directly from package.json. `npm pkg get`
          # walks up to the workspace root and returns a JSON object keyed by
          # package name once `workspaces` is declared there, which breaks the
          # string concatenation below.
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          npm version "$PACKAGE_VERSION-canary.${GITHUB_SHA:0:8}" --allow-same-version --no-git-tag-version
          npm publish --tag=next
      - name: Publish @deque/cauldron-react
        run: |
          cd packages/react
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          npm version "$PACKAGE_VERSION-canary.${GITHUB_SHA:0:8}" --allow-same-version --no-git-tag-version
          npm publish --tag=next
