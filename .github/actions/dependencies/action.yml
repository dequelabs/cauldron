name: 'Dependencies'
description: 'Sets up Node and pnpm and installs dependencies for Cauldron'
inputs:
  install:
    description: 'Run pnpm install'
    default: 'true'

runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      # No version: — the action reads it from packageManager in package.json.
    - uses: actions/setup-node@v6
      with:
        node-version-file: '.nvmrc'
        cache: pnpm
        cache-dependency-path: 'pnpm-lock.yaml'
        registry-url: 'https://registry.npmjs.org'
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
      # Note: Checking for both boolean and string true values due to referenced bug:
      # https://github.com/actions/runner/issues/2238
      if: ${{ inputs.install == true || inputs.install == 'true' }}
