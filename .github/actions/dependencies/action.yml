name: 'Dependencies'
description: 'Sets up Node and installs dependencies for Cauldron'
inputs:
  install:
    description: 'Run yarn install (a single workspace install covers every package)'
    default: 'true'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: yarn
        cache-dependency-path: 'yarn.lock'
        registry-url: 'https://registry.npmjs.org'
    # We need npm 11.5.1+ for OIDC-based publishing support
    # Installing npm 11.11.0 as a workaround for https://github.com/npm/cli/issues/9151
    - run: npm install -g npm@11.11.0
      shell: bash
    - run: npm install -g yarn # Required since we reinstalled npm
      shell: bash
    - name: Install dependencies
      run: yarn install --frozen-lockfile
      shell: bash
      # Note: Checking for both boolean and string true values due to referenced bug:
      # https://github.com/actions/runner/issues/2238
      if: ${{ inputs.install == true || inputs.install == 'true' }}
